[package]
name = "lemonade-cli"
version = "0.5.0"
edition = "2021"
description = "Native CLI for Lemonade Password Manager — fast credential access for the Omarchy desktop"
license = "AGPL-3.0-only"

[[bin]]
name = "lemonade"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
aes-gcm = "0.10"
hex = "0.4"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
